<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <title>Consulta CIAP-2</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto|Varela+Round">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    
    <link rel="stylesheet" href="style.css">
	<link rel="shortcut icon" href="favicon.ico"> 
   
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

	<script type="text/javascript">
		$(document).ready(function () {
			$('[data-toggle="tooltip"]').tooltip();
		});
	</script>
</head>
<body>
	<div class="container">
		<div class="table-wrapper">
			<!--<div class="table-title">-->
            <div>
                <h1 align="center">CIAP-2 - Consulta Rápida</h1>
					<!-- <div class="logo"><a href="index.html"><img src="logo.png" alt="Logo"></a></div> -->
			</div>
			<div class="table-filter">
				<div class="row">
					<div class="table-search">
						<div class="show-entries">
							<span>Mostrar</span>
							<select id="select-entries" class="form-control">
								<option>5</option>
								<option>10</option>
								<option>15</option>
								<option>20</option>
							</select>
							<span>registros</span>
						</div>
					</div>
					<div class="container-fluid">
						<div class="filter-group">
							<div class="group">
								<svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
                                    <g>
                                        <path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"></path>
                                    </g>
                                </svg>
								<input type="text" placeholder="Pesquisar por código, descrição ou categoria..." class="form-control input" id="search" autofocus>
							</div> 
						</div>
					</div>
				</div>
			</div>
			<table class="table table-striped table-hover">
				<thead>
					<tr>
						<th>Código</th>
						<th>Descrição</th>
						<th>Categoria</th>
					</tr>
				</thead>
				<tbody id="tbody">
				</tbody>
			</table>

			<div class="clearfix">
				<div class="hint-text">Mostrando <b id="number1"></b> de <b id="number2"></b> registros</div>
				<ul class="pagination" id="page">
					<ul class="pagination" id="subpage"></ul>
				</ul>
			</div>
		</div>
	</div>
  <script src="./script.js"></script>
</body>
</html>
